[project]
name = "geo-decay"
version = "0.1.0"
description = "Detection and assessment of potentially abandoned infrastructure from PNOA orthophotos, LiDAR and AI."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic-settings", "mlflow-skinny"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "import-linter",
    "pytest",
    "pre-commit",
    "pyyaml",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/geo_decay_domain",
    "src/geo_decay_data",
    "src/geo_decay_application",
    "src/geo_decay_delivery",
]

[tool.ruff]
target-version = "py312"
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["geo_decay_domain", "geo_decay_application", "geo_decay_data", "geo_decay_delivery"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.12"
explicit_package_bases = true
files = ["src", "tests", "scripts"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]

[tool.importlinter]
root_packages = [
    "geo_decay_domain",
    "geo_decay_data",
    "geo_decay_application",
    "geo_decay_delivery",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: delivery above application and data, both above domain"
type = "layers"
layers = [
    "geo_decay_delivery",
    "geo_decay_application | geo_decay_data",
    "geo_decay_domain",
]

[[tool.importlinter.contracts]]
name = "Independence: application and data never import each other"
type = "independence"
modules = [
    "geo_decay_application",
    "geo_decay_data",
]

[[tool.importlinter.contracts]]
name = "Domain purity: no I/O, framework or heavy library in the domain"
type = "forbidden"
source_modules = ["geo_decay_domain"]
forbidden_modules = [
    "osgeo",
    "rasterio",
    "pdal",
    "geopandas",
    "fiona",
    "sqlalchemy",
    "psycopg",
    "fastapi",
    "torch",
    "ultralytics",
    "mlflow",
    "dvc",
]

[[tool.importlinter.contracts]]
name = "Delivery frameworks: application and data never import fastapi"
type = "forbidden"
source_modules = [
    "geo_decay_application",
    "geo_decay_data",
]
forbidden_modules = ["fastapi"]

[[tool.importlinter.contracts]]
name = "MLflow is confined to its adapter"
type = "forbidden"
source_modules = [
    "geo_decay_domain",
    "geo_decay_data",
    "geo_decay_application",
    "geo_decay_delivery",
]
forbidden_modules = ["mlflow"]
ignore_imports = ["geo_decay_data.tracking.mlflow_tracker -> mlflow"]

[tool.uv]
# Keep uv's cache inside the repository: the agent sandbox cannot write to
# the default location under $HOME.
cache-dir = ".uv-cache"
