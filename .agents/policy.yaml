# Write-scope policy for AI agents.
#
# Single source of truth for who may change what. Read by agents as reference
# and, once built, by a working-tree guard (`guard --role <role>`) that the user
# runs before staging: it fails if the changed files touch a secret, a protected
# path or a path outside that role's `write` globs.
# Agents never write to git; the user stages, reviews and commits everything.

version: 1

# Never read or written by any agent.
secrets:
  include:
    - ".env"
    - ".env.*"
    - "**/*.pem"
    - "**/*.key"
    - "**/credentials.json"
  except:
    - ".env.example"

# Changed only by the user, or by an agent the user explicitly authorises in an
# interactive session. Never in a headless run.
protected:
  - ".git/**"
  - ".github/workflows/**"
  - ".devcontainer/**"
  - "Dockerfile*"
  - "docker-compose*.yml"
  - ".pre-commit-config.yaml"
  - ".agents/**"
  - "AGENTS.md"
  - "docs/tfm/**"
  # Tool settings directories.
  - ".claude/**"
  # Tool-specific instruction files: their presence can stop a tool from
  # reading AGENTS.md, so none may be created.
  - "CLAUDE.md"
  - "CLAUDE.local.md"
  - "GEMINI.md"
  - "scripts/policy_guard.py"

roles:
  orchestrator:
    write:
      - "docs/prompts/**"
      - "docs/architecture/**"
      - "docs/roadmap.md"
      - "docs/project_context.md"
      - "docs/next_tasks.md"
      - "docs/experiments/**"
      - "docs/sprints/**"
      - "docs/research/**"
      - "docs/README.md"
      - "README.md"

  developer:
    write:
      - "src/**"
      - "tests/unit/**"
      - "tests/conftest.py"
      - "tests/__init__.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".dockerignore"
      - "tests/acceptance/.gitkeep"
      - "scripts/**"
      - ".env.example"
      # MLOps artefacts (Block 2): pipelines and tracked-data placeholders.
      - "dvc.yaml"
      - "dvc.lock"
      - ".dvc/**"
      - "data/**/.gitkeep"
      - "models/**/.gitkeep"

  tester:
    write:
      - "tests/acceptance/**"

  documenter:
    write:
      - "docs/current_state.md"
      - "docs/next_tasks.md"
      - "docs/sprints/**"
      - "docs/experiments/**"
